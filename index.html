<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReachDesk CRM — CRM for Freelancers & Agency Owners</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
  <meta name="msapplication-TileColor" content="#050505">
  <meta name="msapplication-TileImage" content="/android-chrome-192x192.png">

  <link rel="preload" href="/fonts/Mattone-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <!-- Apply saved theme before paint to avoid old-theme flash on load / signup -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('reachdesk_theme') || localStorage.getItem('hp-theme') || 'dark';
        if (t === 'light') document.documentElement.classList.add('light');
        else document.documentElement.classList.remove('light');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        document.documentElement.style.backgroundColor = t === 'light' ? '#FAFAFA' : '#050505';
        document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
      } catch (e) {}
    })();
  </script>
  <style>
    /* Mattone must be available before the JS/CSS bundle — prevents loader FOUT */
    @font-face {
      font-family: 'Mattone';
      src: url('/fonts/Mattone-Regular.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }
    html, body { margin: 0; background: #050505; color: #FFFFFF; }
    html.light, html.light body { background: #FAFAFA; color: #0A0A0A; }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .boot-loader {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: inherit;
      color: inherit;
    }
    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top: 3px solid #FFFFFF;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    html.light .loading-spinner {
      border: 3px solid rgba(10, 10, 10, 0.12);
      border-top: 3px solid #0A0A0A;
    }
    .loading-text {
      font-family: 'Mattone', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot-loader">
      <div class="loading-spinner"></div>
      <div class="loading-text">REACHDESK CRM</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
